[package]
name = "qq"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[workspace]
members = [
  "crates/qq-auth",
  "crates/qq-client",
  "crates/qq-config",
  "crates/qq-core",
  "crates/qq-mcp",
  "crates/qq-provider",
  "crates/qq-protocol",
  "crates/qq-reasoning",
  "crates/qq-server",
  "crates/qq-tui",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lg2m/qq"

[workspace.dependencies]
async-stream = "0.3"
atomic-write-file = "0.3"
aws-config = { version = "1.10.0", default-features = false, features = ["default-https-client", "rt-tokio", "sso"] }
aws-credential-types = "1.3.0"
aws-sdk-bedrockruntime = { version = "1.137.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sigv4 = "1.5.1"
aws-smithy-http-client = { version = "1.2.0", default-features = false, features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = "1.13.0"
aws-smithy-types = "1.6.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
bytes = "1"
cap-std = "4"
cap-primitives = "4"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
directories = "6"
futures-core = "0.3"
futures-util = "0.3"
getrandom = "0.3"
hmac = "0.12"
http-body = "1"
keyring = "4"
qq-auth = { path = "crates/qq-auth" }
qq-client = { path = "crates/qq-client" }
qq-config = { path = "crates/qq-config" }
qq-core = { path = "crates/qq-core" }
qq-mcp = { path = "crates/qq-mcp" }
qq-provider = { path = "crates/qq-provider", default-features = false }
qq-protocol = { path = "crates/qq-protocol" }
qq-reasoning = { path = "crates/qq-reasoning" }
qq-server = { path = "crates/qq-server" }
qq-tui = { path = "crates/qq-tui" }
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1", default-features = false, features = ["process", "std"] }
# reqwest 0.13.2 dropped the optional `webpki-roots` dependency (and with it
# the implicit `webpki-roots` feature); the `rustls` feature verifies against
# platform trust roots via rustls-platform-verifier instead.
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "form", "json", "rustls", "stream"] }
rmcp = { version = "3.0.0", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
ron = "0.12"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
webbrowser = "1"

[dependencies]
clap.workspace = true
directories.workspace = true
futures-core.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hmac.workspace = true
qq-auth.workspace = true
qq-client.workspace = true
qq-config.workspace = true
qq-core.workspace = true
qq-mcp.workspace = true
qq-provider.workspace = true
qq-protocol.workspace = true
qq-server.workspace = true
qq-tui.workspace = true
reqwest.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
webbrowser.workspace = true

[profile.release]
# The shipped binary is size- and latency-gated (`benchmarks/perf`). Symbols
# are stripped because panics print locations, not backtraces, in release;
# one codegen unit with thin LTO lets LLVM inline across the store/feed hot
# path and drop unreferenced monomorphs.
strip = "symbols"
codegen-units = 1
lto = "thin"

[features]
# Feature manifests for the shipped binary. `default` is the full profile with
# every supported provider family. The minimal embedding profile is
# `--no-default-features`: HTTP provider families only, no AWS SDK closure.
# Configured Bedrock providers then fail at compile time with a
# configuration error rather than at request time.
default = ["provider-bedrock"]
provider-bedrock = ["qq-provider/provider-bedrock"]

[dev-dependencies]
base64.workspace = true
ron.workspace = true
tempfile.workspace = true
