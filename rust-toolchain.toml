[toolchain]
channel = "1.97.1"
profile = "minimal"
components = [
  "clippy",
  "llvm-tools-preview",
  "rust-analyzer",
  "rust-src",
  "rustfmt",
]
# `x86_64-unknown-linux-musl`: static evaluation binary uploaded into
# Terminal-Bench task containers; see benchmarks/harbor/README.md.
# `wasm32-unknown-unknown`: `qq-client --features wasm` for browser clients.
targets = ["x86_64-unknown-linux-musl", "wasm32-unknown-unknown"]
