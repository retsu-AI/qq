# Test runner configuration. `cargo xtask check` and CI drive nextest through
# these profiles; plain `cargo nextest run` uses `default`.
experimental = ["setup-scripts"]

[store]
dir = "target/nextest"

[scripts.setup.tmpfs-tmpdir]
command = { command-line = ".config/nextest-tmpdir.sh", relative-to = "workspace-root" }

[profile.default]
# Shell-heavy session fixtures compete for processes and SQLite workers.
# Bound simultaneous test processes instead of amplifying host load.
test-threads = 8
# Report every failure in one run; agents fix them in a batch.
fail-fast = false
status-level = "fail"
final-status-level = "slow"
failure-output = "final"
# A test still running after 60 s is reported; after 180 s it is killed.
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.scripts]]
platform = { host = "cfg(target_os = \"linux\")" }
filter = 'all()'
setup = 'tmpfs-tmpdir'

[[profile.default.overrides]]
filter = '(package(qq-core) & test(/^sessions::tests::(goal_driver_soak|deadlines|compaction|goals|delegation|runs|goal_check|feeds)::/)) | binary_id(qq-core::soak) | (package(xtask) & test(/^perf::tests::/))'
priority = 100

[profile.quick]
fail-fast = true
status-level = "fail"
final-status-level = "fail"

[profile.ci]
fail-fast = false
status-level = "fail"
final-status-level = "flaky"
failure-output = "immediate-final"
# A retried pass is reported as FLAKY in the summary and JUnit; it is a
# signal to fix, not a pass to ignore.
retries = 1

flaky-result = "fail"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"
