name: Windows host token proof
on:
  push:
    branches: [test/windows-host-token-corrected]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-token:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-host-token-corrected-${{ matrix.os }}
          cache-on-failure: true
      - name: Compile the safe API composition
        shell: pwsh
        run: cargo build --locked -p qq-core --example windows_host_token
      - name: Run ordinary LPAC control then host restricted token composition
        shell: pwsh
        run: .\target\debug\examples\windows_host_token.exe
