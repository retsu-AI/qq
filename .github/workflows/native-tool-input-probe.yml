name: Windows native security API probe
on:
  push:
    branches: [test/windows-tool-input-probe]
  workflow_dispatch:
jobs:
  native-command-owner:
    strategy:
      matrix:
        os: [windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read null-device security without changing it
        shell: pwsh
        run: |
          $probeSource = @'
          using System;
          using System.Runtime.InteropServices;
          using Microsoft.Win32.SafeHandles;
          public static class NullSecurityProbe {
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            static extern SafeFileHandle CreateFile(string name, uint access, uint share, IntPtr security, uint disposition, uint flags, IntPtr template);
            [DllImport("advapi32.dll", SetLastError=true)]
            static extern uint GetSecurityInfo(SafeFileHandle handle, uint type, uint requested, out IntPtr owner, out IntPtr group, out IntPtr dacl, out IntPtr sacl, out IntPtr descriptor);
            [DllImport("advapi32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            static extern bool ConvertSecurityDescriptorToStringSecurityDescriptor(IntPtr descriptor, uint revision, uint requested, out IntPtr text, out uint length);
            [DllImport("kernel32.dll")]
            static extern IntPtr LocalFree(IntPtr memory);
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            static extern IntPtr LoadLibraryEx(string name, IntPtr file, uint flags);
            [DllImport("kernel32.dll", CharSet=CharSet.Ansi, ExactSpelling=true)]
            static extern IntPtr GetProcAddress(IntPtr module, string name);
            [DllImport("kernel32.dll")]
            static extern bool FreeLibrary(IntPtr module);
            [UnmanagedFunctionPointer(CallingConvention.Winapi)]
            delegate int VersionSupported(uint major, out byte available, out uint minor);
            public static string NullDescriptor { get; private set; }
            public static void Read() {
              var module = LoadLibraryEx("processmodel.dll", IntPtr.Zero, 0x800);
              if (module == IntPtr.Zero) {
                Console.WriteLine("processmodel.dll unavailable: " + Marshal.GetLastWin32Error());
              } else {
                try {
                  foreach (string name in new[] { "CreateProcessSecurityEnvironment", "IsProcessSecurityEnvironmentVersionSupported", "QueryProcessSecurityEnvironmentSupport", "Experimental_CreateProcessInSandbox", "Experimental_QuerySandboxSupport" }) {
                    Console.WriteLine(name + " export present: " + (GetProcAddress(module, name) != IntPtr.Zero));
                  }
                  var address = GetProcAddress(module, "IsProcessSecurityEnvironmentVersionSupported");
                  if (address != IntPtr.Zero) {
                    byte available; uint minor;
                    var query = Marshal.GetDelegateForFunctionPointer<VersionSupported>(address);
                    int result = query(1, out available, out minor);
                    Console.WriteLine("PSEC version 1 support: HRESULT=" + result + "; available=" + available + "; minor=" + minor);
                  }
                } finally { FreeLibrary(module); }
              }
              using (var handle = CreateFile(@"\\.\NUL", 0x20000, 3, IntPtr.Zero, 3, 0, IntPtr.Zero)) {
                if (handle.IsInvalid) { Console.WriteLine("NUL READ_CONTROL failed: " + Marshal.GetLastWin32Error()); return; }
                IntPtr owner, group, dacl, sacl, descriptor;
                // SE_KERNEL_OBJECT; OWNER | GROUP | DACL | LABEL only. No writes.
                uint flags = 1 | 2 | 4 | 16;
                uint error = GetSecurityInfo(handle, 6, flags, out owner, out group, out dacl, out sacl, out descriptor);
                if (error != 0) { Console.WriteLine("NUL security read failed: " + error); return; }
                try {
                  IntPtr text; uint length;
                  if (ConvertSecurityDescriptorToStringSecurityDescriptor(descriptor, 1, flags, out text, out length)) {
                    try { NullDescriptor = Marshal.PtrToStringUni(text); Console.WriteLine("NUL SDDL: " + NullDescriptor); } finally { LocalFree(text); }
                  } else { Console.WriteLine("NUL SDDL conversion failed: " + Marshal.GetLastWin32Error()); }
                } finally { LocalFree(descriptor); }
              }
            }
          }
          '@
          [System.IO.File]::WriteAllText("$env:RUNNER_TEMP/qq-null-security-probe.cs", $probeSource)
          Add-Type -TypeDefinition $probeSource
          [System.Environment]::OSVersion.VersionString
          [NullSecurityProbe]::Read()
          if (-not [NullSecurityProbe]::NullDescriptor) { throw 'Null-device security baseline is missing' }
          [System.IO.File]::WriteAllText("$env:RUNNER_TEMP/qq-null-before.txt", [NullSecurityProbe]::NullDescriptor)
      - name: Exercise native API tool access and denial behavior
        shell: pwsh
        run: |
          $probeDirectory = Join-Path $env:TEMP 'qq-mxc-api-probe'
          New-Item -ItemType Directory -Force $probeDirectory | Out-Null
          npm install --prefix $probeDirectory --ignore-scripts --no-audit --no-fund @microsoft/mxc-sdk@1.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item .github/scripts/windows-native-api-probe.mjs $probeDirectory
          $tools = @((Get-Command node.exe).Source, (Get-Command cargo.exe).Source)
          $rustup = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $env:USERPROFILE '.rustup' }
          $roots = @($env:SystemRoot, $rustup) + $tools + @($tools | ForEach-Object { Split-Path $_ })
          $before = @($roots | ForEach-Object { (Get-Acl -LiteralPath $_).Sddl })
          Add-Type -Path .github/scripts/windows-basic-user-probe.cs
          $log = Join-Path $probeDirectory 'basic-user.log'
          $code = [BasicUserProbe]::Run($tools[0], (Join-Path $probeDirectory 'windows-native-api-probe.mjs'), $log)
          Get-Content $log
          $after = @($roots | ForEach-Object { (Get-Acl -LiteralPath $_).Sddl })
          if (Compare-Object $before $after) { throw 'Native API probe changed host tool security descriptors' }
          if ($code -ne 0) { throw "Basic-user native API fixture failed: $code" }
      - name: Verify the API probe did not change null-device security
        if: always()
        shell: pwsh
        run: |
          Add-Type -Path "$env:RUNNER_TEMP/qq-null-security-probe.cs"
          [NullSecurityProbe]::Read()
          $before = [System.IO.File]::ReadAllText("$env:RUNNER_TEMP/qq-null-before.txt")
          if ($before -ne [NullSecurityProbe]::NullDescriptor) { throw 'Native API probe changed null-device security' }
