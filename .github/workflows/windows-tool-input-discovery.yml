name: Windows task home Auto qualification
on:
  push:
    branches: [test/windows-task-home-auto]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-tool-input-discovery-${{ matrix.os }}
          cache-on-failure: true
      - name: Verify the exact production profile regression and identity cases
        shell: bash
        run: |
          selector=command_owner::environment::tests::windows_task_home_supports_shell_profile_paths_and_called_batches
          cargo test --locked -p qq-core "$selector" -- --list | tr -d '\r' | grep -Fx "$selector: test"
          cargo test --locked -p qq-core "$selector" -- --exact --nocapture
          cargo test --locked -p qq-core command_owner::environment::tests::windows_task_home_preserves_extended_only_names -- --exact --nocapture
      - name: Lint the exact native production source
        shell: bash
        run: cargo clippy --locked -p qq-core --all-targets -- -D warnings
      - name: Build the native command helper
        shell: bash
        run: cargo build --locked -p qq-core --example command_owner
      - name: Diagnose the production Auto installed tool boundary
        shell: bash
        run: |
          selector=runtime::windows_auto_tests::default_auto_contains_shell_writes_and_publishes_detached_output
          cargo test --locked -p qq --no-default-features --bin qq -- --list | tr -d '\r' | grep -Fx "$selector: test"
          cargo test --locked -p qq --no-default-features --bin qq "$selector" -- --exact --nocapture
