name: Website

# Builds the site on every change to it or to the guide it is generated from,
# and publishes to GitHub Pages from main. Pull requests only build.

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/guide/**
      - install.sh
      - Cargo.toml
      - .github/workflows/website.yml
  pull_request:
    paths:
      - website/**
      - docs/guide/**
      - install.sh
      - Cargo.toml
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # nub installs from a release archive in about a second, provisions the
      # Node pinned by website/package.json engines, and caches its store.
      - uses: nubjs/setup-nub@v0.6.0
        with:
          working-directory: website
      - name: Install
        run: nub ci
        working-directory: website
      - name: Build
        run: nub run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
