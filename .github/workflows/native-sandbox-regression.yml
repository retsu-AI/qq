name: Native sandbox regression

on:
  push:
    branches: [test/native-sandbox-regression]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-anchors:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-anchors-${{ matrix.os }}
      - name: Prove writable-ancestor replacement before the fix
        shell: bash
        run: |
          git checkout d64fef25
          set +e
          cargo test --locked -p qq-core tools::macos_owner::tests::writable_grant_anchors_survive_content_edits_and_replacement_attempts -- --exact --nocapture > "$RUNNER_TEMP/anchors-before.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/anchors-before.log"
          test "$result" -ne 0
          # Require the precise relocation assertion, not a compile/setup error.
          grep -F 'an intermediate directory carrying a grant root was relocated' "$RUNNER_TEMP/anchors-before.log"
      - name: Verify protected roots and writable contents after the fix
        shell: bash
        run: |
          git checkout "$GITHUB_SHA"
          bash .github/scripts/test-exact.sh tools::macos_owner::tests::writable_grant_anchors_survive_content_edits_and_replacement_attempts
