name: Unix SDK native qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-sdk:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build real CLI and public cache prerequisites
        run: cargo build --locked -p qq --no-default-features
      - name: Check selected cache and installed toolchain resolver
        run: |
          cargo test --locked -p qq-core task_workspace::cargo::tests:: -- --nocapture
          cargo test --locked -p qq --no-default-features runtime::unix_sdk::tests:: -- --nocapture
      - name: Require and execute actual cached dependency Auto integration
        run: |
          cargo test --locked -p qq --no-default-features --test command_worker_client -- --list --ignored > "$RUNNER_TEMP/sdk-tests.txt"
          grep -Fx 'runtime::cargo::cached_public_dependency_builds_in_default_auto: test' "$RUNNER_TEMP/sdk-tests.txt"
          cargo test --locked -p qq --no-default-features --test command_worker_client runtime::cargo::cached_public_dependency_builds_in_default_auto -- --ignored --exact --nocapture
      - name: Preserve existing native containment checks
        if: ${{ !cancelled() }}
        run: |
          cargo build --locked -p qq-core --example command_owner
          cargo test --locked -p qq --no-default-features --test command_worker_client macos:: -- --test-threads=1 --nocapture
      - name: Require and execute actual installed Node build/test integration
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p qq --no-default-features --test command_worker_client -- --list --ignored > "$RUNNER_TEMP/node-sdk-tests.txt"
          grep -Fx 'runtime::node::installed_node_builds_and_tests_in_default_auto: test' "$RUNNER_TEMP/node-sdk-tests.txt"
          cargo test --locked -p qq --no-default-features --test command_worker_client runtime::node::installed_node_builds_and_tests_in_default_auto -- --ignored --exact --nocapture
      - name: Lint native source
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p qq-core -p qq --all-targets --no-default-features -- -D warnings
