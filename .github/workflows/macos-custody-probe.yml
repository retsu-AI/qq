name: macOS native custody probe

on:
  push:
    branches: [test/macos-native-custody]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seatbelt-prerequisites:
    strategy:
      fail-fast: false
      matrix:
        mode: [launchservices-seatbelt, launchservices-guardian]
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check native custody prerequisite
        run: python3 -I .github/scripts/macos-custody-probe.py "${{ matrix.mode }}"
