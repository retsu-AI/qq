name: Windows owned-drive alias proof
on:
  push:
    branches: [test/windows-drive-alias]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alias-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-owned-alias-${{ matrix.os }}
          cache-on-failure: true
      - name: Check inherited bounded pipe and job tests
        run: cargo test --locked -p qq-core --example windows_drive_alias
      - name: Compile native fixture
        run: cargo build --locked -p qq-core --example windows_drive_alias
      - name: Lint native fixture
        run: cargo clippy --locked -p qq-core --example windows_drive_alias -- -D warnings
      - name: Compare host and AppContainer tools through owned alias
        run: |
          $cargo = (& rustup which cargo).Trim()
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $cargo -PathType Leaf)) {
            throw 'Repository-selected installed Cargo unavailable'
          }
          $bin = Split-Path -Parent $cargo
          $rustc = Join-Path $bin 'rustc.exe'
          $selectedRustc = (& rustup which rustc).Trim()
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $rustc -PathType Leaf) -or $rustc -ine $selectedRustc) {
            throw 'Cargo and rustc must belong to the same repository-selected toolchain'
          }
          $toolchain = Split-Path -Parent $bin
          $toolchains = Split-Path -Parent $toolchain
          $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $env:USERPROFILE '.rustup' }
          if ((Split-Path -Leaf $bin) -ine 'bin' -or $toolchains -ine (Join-Path $rustupHome 'toolchains')) {
            throw 'Selected toolchain must be an installed direct Rust toolchain'
          }
          Write-Host "Selected Cargo: $cargo"
          Write-Host "Selected rustc: $rustc"
          & $cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'Selected Cargo version query failed' }
          & $rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'Selected rustc version query failed' }
          $env:PATH = "$bin;$env:PATH"
          .\target\debug\examples\windows_drive_alias.exe
