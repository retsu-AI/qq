name: Windows actual Cargo startup attribution
on:
  push:
    branches: [test/windows-cargo-startup]
permissions:
  contents: read
jobs:
  cargo-startup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-cargo-startup-${{ matrix.os }}
          cache-on-failure: true
      - name: Apply scoped own-package namespace adapter
        run: |
          $adapter = Join-Path $env:RUNNER_TEMP 'rappct-owned-namespace'
          git clone --no-checkout https://github.com/retsu-AI/rappct $adapter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $adapter checkout --detach 4f3449402a6cad646374404043cf90df4e090939
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $adapter apply --check "$env:GITHUB_WORKSPACE/.github/fixtures/rappct-owned-namespace.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $adapter apply "$env:GITHUB_WORKSPACE/.github/fixtures/rappct-owned-namespace.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $config = Join-Path $env:RUNNER_TEMP 'rappct-owned-namespace.toml'
          $normalized = $adapter.Replace([IO.Path]::DirectorySeparatorChar, [char]'/')
          "[patch.`"https://github.com/retsu-AI/rappct`"]`nrappct = { path = `"$normalized`" }" | Set-Content -LiteralPath $config -Encoding utf8NoBOM
          "QQ_RAPPCT_PATCH=$config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          cargo update --config $config -p rappct
          exit $LASTEXITCODE
      - name: Build exact payload probes and durable worker
        run: |
          cargo build --config $env:QQ_RAPPCT_PATCH --locked -p qq-core --example windows_cargo_images --example command_owner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --config $env:QQ_RAPPCT_PATCH --locked -p qq-core --example windows_cargo_images -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --config $env:QQ_RAPPCT_PATCH --locked -p qq --no-default-features --bin qq -- -D warnings
          exit $LASTEXITCODE
      - name: Exact installed default compiler dependency manifest and real Auto
        run: |
          $default = ((& rustup default) -split '\s+')[0]
          if ($LASTEXITCODE -ne 0 -or $default -notmatch '^[A-Za-z0-9_.+-]+$') { throw 'Installed server default unavailable' }
          $cargo = (& rustup which --toolchain $default cargo).Trim()
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $cargo)) { throw 'Selected Cargo unavailable' }
          $rustc = (& rustup which --toolchain $default rustc).Trim()
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $rustc)) { throw 'Selected rustc unavailable' }
          Write-Host "Actual server-default toolchain=$default Cargo=$cargo rustc=$rustc"
          $manifest = Join-Path $env:RUNNER_TEMP 'qq-exact-cargo-images.json'
          & .\target\debug\examples\windows_cargo_images.exe --prepare $cargo $rustc | Set-Content -LiteralPath $manifest -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw 'Exact compiler PE metadata failed' }
          $env:QQ_CARGO_IMAGES = $manifest
          $debugger = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          if ($env:PROCESSOR_ARCHITECTURE -eq 'AMD64') {
            $signature = Get-AuthenticodeSignature -LiteralPath $debugger
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation(?:,|$)') { throw 'Expected installed signed Microsoft CDB' }
            Write-Host 'Installed Microsoft-signed SDK CDB verified'
          } else { Write-Host 'SDK CDB not available for ARM diagnostic; no substitute installed' }
          $artifacts = & cargo test --config $env:QQ_RAPPCT_PATCH --locked -p qq --no-default-features --bin qq --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $executables = @($artifacts | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'qq' -and $_.profile.test -and $_.executable } | ForEach-Object { $_.executable })
          if ($executables.Count -ne 1) { throw 'Expected one exact qq runtime test binary' }
          # Remove only recognized Node install PATH entries before runtime
          # composition, so unrelated SDK copying cannot mask Cargo startup.
          $nodeRoots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}) | Where-Object { $_ } | ForEach-Object { Join-Path $_ 'nodejs' }
          $env:PATH = (($env:PATH -split ';') | Where-Object { $nodeRoots -inotcontains $_.TrimEnd('\') }) -join ';'
          & $executables[0] runtime::windows_cargo_tests::installed_cargo_startup_through_real_auto_worker --exact --nocapture 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'qq-cargo-startup.log')
          exit $LASTEXITCODE
      - name: Preserve complete Cargo diagnostic output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-startup-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/qq-cargo-startup.log
            ${{ runner.temp }}/qq-cargo-access-denials.json
            ${{ runner.temp }}/qq-cargo-trace-status.json
          if-no-files-found: warn
