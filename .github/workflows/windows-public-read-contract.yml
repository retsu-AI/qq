name: Windows public read worker validation
on:
  push:
    branches: [test/windows-public-read-contract]
permissions:
  contents: read
jobs:
  production-worker:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: command-owner-${{ matrix.os }}
          cache-on-failure: true
      - name: Empty capability layout before correction
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          layout="$RUNNER_TEMP/qq-rappct-capability-layout"
          git clone --no-checkout https://github.com/retsu-AI/rappct.git "$layout"
          git -C "$layout" checkout --detach 2072cdbe578151684f5ce67b1996da88e81d39ac
          selector=ffi::sec_caps::tests::empty_capabilities_use_a_null_pointer
          cargo test --locked --manifest-path "$layout/Cargo.toml" --lib -- --list | tr -d '\r' | grep -Fx "$selector: test"
          set +e
          cargo test --locked --manifest-path "$layout/Cargo.toml" --lib "$selector" -- --exact > "$RUNNER_TEMP/empty-caps-before.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/empty-caps-before.log"
          test "$status" -eq 101
          grep -F 'assertion failed: capabilities.sc.Capabilities.is_null()' "$RUNNER_TEMP/empty-caps-before.log"
      - name: Empty capability layout after correction
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          layout="$RUNNER_TEMP/qq-rappct-capability-layout"
          git -C "$layout" checkout --detach 4f3449402a6cad646374404043cf90df4e090939
          selector=ffi::sec_caps::tests::empty_capabilities_use_a_null_pointer
          cargo test --locked --manifest-path "$layout/Cargo.toml" --lib -- --list | tr -d '\r' | grep -Fx "$selector: test"
          cargo test --locked --manifest-path "$layout/Cargo.toml" --lib "$selector" -- --exact
      - name: Native production Clippy
        shell: bash
        run: |
          cargo clippy --locked -p qq-core --all-targets -- -D warnings
          cargo clippy --locked -p qq --no-default-features --bin qq --test command_worker_client -- -D warnings
      - name: Build actual helper fixture
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo build --locked -p qq-core --example command_owner
          cargo build --locked -p qq --no-default-features --example windows_tool_inputs
      - name: Actual Windows worker boundary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo test --locked -p qq --no-default-features --test command_worker_client -- --list | tr -d '\r' | grep -Fx 'windows::arap_writable_host_files_remain_readable_but_not_writable_through_the_real_worker: test'
          cargo test --locked -p qq --no-default-features --test command_worker_client windows:: -- --test-threads=1 --nocapture
      - name: Actual default Auto session
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo test --locked -p qq --no-default-features --bin qq -- --list | tr -d '\r' | grep -Fx 'runtime::windows_auto_tests::default_auto_contains_shell_writes_and_publishes_detached_output: test'
          cargo test --locked -p qq --no-default-features --bin qq runtime::windows_auto_tests::default_auto_contains_shell_writes_and_publishes_detached_output -- --exact --nocapture
