[package]
name = "qq-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util.workspace = true
pulldown-cmark = "0.13"
qq-client.workspace = true
qq-core.workspace = true
qq-protocol.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-highlight = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
tempfile.workspace = true
unicode-width = "0.2"

[features]
# Exposes deterministic fixtures and a frame driver to this package's own
# render benchmark via the self dev-dependency below. Not a public API.
bench-support = []

[dev-dependencies]
qq-tui = { path = ".", features = ["bench-support"] }
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "render"
harness = false
