[package]
name = "qq-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-stream.workspace = true
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-runtime = { workspace = true, optional = true }
aws-sdk-bedrockruntime = { workspace = true, optional = true }
aws-sigv4 = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, optional = true }
aws-smithy-runtime-api = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http-body.workspace = true
httpdate.workspace = true
qq-reasoning.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[features]
# The HTTP adapter families (OpenAI Responses and Chat Completions, Anthropic
# Messages, Google GenerateContent) are always built: they share one reqwest
# transport and add no dependency of their own. Only the Amazon Bedrock family
# (Bedrock Runtime Converse and Bedrock Mantle SigV4) is optional because it
# alone pulls the AWS SDK closure. `default` is the full binary profile;
# embedders that compile only HTTP families disable default features.
default = ["provider-bedrock"]
provider-bedrock = [
    "dep:aws-config",
    "dep:aws-runtime",
    "dep:aws-credential-types",
    "dep:aws-sdk-bedrockruntime",
    "dep:aws-sigv4",
    "dep:aws-smithy-http-client",
    "dep:aws-smithy-runtime-api",
    "dep:aws-smithy-types",
]
# Exposes the loopback test harness (`test_support`) to this package's own
# integration tests via the self dev-dependency below. Not a public API.
test-support = []

[dev-dependencies]
qq-provider = { path = ".", default-features = false, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "provider_compiler"
harness = false

[[bench]]
name = "provider_encode"
harness = false
required-features = ["test-support"]

[[bench]]
name = "sse_decode"
harness = false
required-features = ["test-support"]
