[package]
name = "qq-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["tool-fetch"]
tool-fetch = ["dep:htmd"]

[dependencies]
async-stream.workspace = true
base64.workspace = true
cap-std.workspace = true
cap-primitives.workspace = true
crossbeam-channel.workspace = true
futures-core.workspace = true
futures-util.workspace = true
fs4.workspace = true
htmd = { workspace = true, optional = true }
ignore.workspace = true
ipnet.workspace = true
qq-provider.workspace = true
qq-protocol.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

tracing.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "event", "pipe", "thread", "net"] }

[target.'cfg(target_os = "macos")'.dependencies]
command-fds.workspace = true
libproc.workspace = true
nix.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["mount"] }
command-fds.workspace = true
landlock.workspace = true
goblin.workspace = true
nix.workspace = true

[target.'cfg(all(target_os = "linux", target_endian = "little", any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "riscv64")))'.dependencies]
seccompiler.workspace = true

[target.'cfg(windows)'.dependencies]
dunce.workspace = true
directories.workspace = true
rappct.workspace = true
tempfile.workspace = true
subc-jobobject.workspace = true
win32job.workspace = true
win-custody.workspace = true
winsafe = { workspace = true, features = ["kernel"] }
firehazard.workspace = true
windows-permissions.workspace = true
winapi-util.workspace = true

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
qq-provider = { workspace = true, features = ["test-support"] }
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dev-dependencies]
firehazard_sid = { package = "firehazard", git = "https://github.com/MaulingMonkey/firehazard", rev = "1b5818d8fa6c489addb8cbb133a62ab917cc1715" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["net"] }

[[bench]]
name = "tool_dispatch"
harness = false

[[bench]]
name = "plan_compile"
harness = false

[[bench]]
name = "catalog_compile"
harness = false

[[bench]]
name = "store_output_batch"
harness = false

[[bench]]
name = "context_assembly"
harness = false

[[bench]]
name = "turn_overhead"
harness = false

[[bench]]
name = "child_admission"
harness = false

[[bench]]
name = "tool_output"
harness = false

[[bench]]
name = "search_walk"
harness = false

[[bench]]
name = "edit_batch"
harness = false

[[bench]]
name = "classify_command"
harness = false

[[bench]]
name = "host_cancel_latency"
harness = false

[[bench]]
name = "workspace_index"
harness = false
