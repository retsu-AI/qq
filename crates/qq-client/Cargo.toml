[package]
name = "qq-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["native"]
native = ["dep:tokio", "reqwest/rustls"]
wasm = ["qq-protocol/wasm", "dep:wasm-bindgen-futures", "dep:gloo-timers"]

[dependencies]
async-stream.workspace = true
futures-core.workspace = true
futures-util.workspace = true
qq-protocol.workspace = true
reqwest = { workspace = true, default-features = false, features = ["json", "stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
qq-server.workspace = true
tempfile.workspace = true
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
