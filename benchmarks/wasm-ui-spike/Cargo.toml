[workspace]
resolver = "2"
members = ["common", "baseline", "leptos", "dioxus"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
spike-common = { path = "common" }
qq-client = { path = "../../crates/qq-client", default-features = false, features = ["wasm"] }
qq-protocol = { path = "../../crates/qq-protocol", default-features = false, features = ["wasm"] }
futures-util = { version = "0.3", default-features = false }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
reqwest = { version = "0.13.2", default-features = false, features = ["json"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Location", "Performance", "console"] }

# Identical release settings for both candidates so bundle size compares the
# framework, not the profile. Mirrors what a production `apps/` build would use.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
