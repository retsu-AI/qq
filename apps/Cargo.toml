# The web surfaces: a separate workspace from the kernel (ADR-0018). Members
# compile for `wasm32-unknown-unknown` and are built by Trunk; see README.md.
[workspace]
resolver = "2"
members = ["ui-common", "shell", "sessions"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
qq-ui-common = { path = "ui-common" }
qq-client = { path = "../crates/qq-client", default-features = false, features = ["wasm"] }
qq-protocol = { path = "../crates/qq-protocol", default-features = false, features = ["wasm"] }
leptos = { version = "0.8", features = ["csr"] }
js-sys = "0.3"
reqwest = { version = "0.13.2", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "Location", "Url", "console"] }

# Smallest wasm the toolchain produces; measured in the ADR-0017 spike.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
